<!doctype html>
<html lang="en" data-theme="nebula" data-font="orbit" data-bg="stars">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:; script-src 'self'; connect-src 'self' https: data:" />
  <title>Orbit</title>
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/polish.css" />
  <script src="../../node_modules/skinview3d/bundles/skinview3d.bundle.js"></script>
</head>
<body>
  <div class="space">
    <canvas id="starfield"></canvas>
    <div class="nebula n1"></div><div class="nebula n2"></div><div class="nebula n3"></div>
    <div class="planet"><div class="planet-ring"></div></div>
  </div>
  <div class="shell">
    <header class="command">
      <div class="brand">
        <div class="brand-mark"><span class="core"></span><span class="ring"></span><span class="moon"></span></div>
        <div>
          <div class="brand-title">ORBIT</div>
          <div class="brand-sub"><span class="pulse"></span><span id="app-version">v1.0.0</span></div>
        </div>
      </div>
      <nav class="tabs-nav" id="nav"><span class="tab-glider" id="glider"></span></nav>
      <div class="command-right">
        <button class="pill" id="running-pill"></button>
        <div class="account" id="account"></div>
        <button class="icon-btn round" id="nav-settings" data-page="settings" title="Settings"></button>
        <div class="win-controls">
          <button class="win" id="win-min" title="Minimize"></button>
          <button class="win" id="win-max" title="Maximize"></button>
          <button class="win close" id="win-close" title="Close"></button>
        </div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </div>
  <div id="dock" class="dock"></div>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
